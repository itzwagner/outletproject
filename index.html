<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETERNA | Global Outlet Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Ícones via FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="logo">AETERNA</div>
        <nav class="nav">
            <button class="nav-btn active" onclick="filterProducts('all')">Todos</button>
            <button class="nav-btn" onclick="filterProducts('masculino')">Masculino</button>
            <button class="nav-btn" onclick="filterProducts('feminino')">Feminino</button>
        </nav>
        <div class="user-actions">
            <a href="#" class="icon-link"><i class="fa-regular fa-user"></i> Login</a>
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-count">0</span>
            </button>
        </div>
    </header>

    <!-- BANNER PRINCIPAL -->
    <section class="hero">
        <div class="hero-content">
            <span class="hero-subtitle">OUTLET INTERNACIONAL</span>
            <h1>The Global Collection</h1>
            <p>Peças exclusivas importadas com condições especiais de outlet.</p>
            <button class="btn-primary" onclick="document.getElementById('catalog').scrollIntoView({behavior: 'smooth'})">Explorar Coleção</button>
        </div>
    </section>

    <!-- CATÁLOGO DE PRODUTOS -->
    <main class="main-container" id="catalog">
        <div class="section-header">
            <h2>Destaques Internacionais</h2>
            <p>Os itens mais vendidos na gringa</p>
        </div>

        <div class="products-grid" id="products-grid">
            <!-- Produtos inseridos dinamicamente via JS -->
        </div>
    </main>

    <!-- MODAL DE DETALHES DO PRODUTO -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-body" id="modal-body">
                <!-- Conteúdo dinâmico do produto -->
            </div>
        </div>
    </div>

    <!-- PAINEL LATERAL DO CARRINHO -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Seu Carrinho</h3>
            <span class="close-cart" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items" id="cart-items">
            <p class="empty-cart-msg">Seu carrinho está vazio.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$ 0,00</span>
            </div>
            <button class="btn-primary btn-block" onclick="checkout()">Finalizar Compra</button>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="footer">
        <p>&copy; 2026 AETERNA Outlet. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
